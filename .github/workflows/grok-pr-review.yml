name: Grok PR Review

# Manual only. Auto pull_request runs red the PR "review" check whenever
# GROK_AUTH_JSON is stale (SuperGrok OIDC ~hours), and GitHub still reports
# that check as fail even with continue-on-error / fail_on: never.
# Re-enable on: pull_request only if you keep the secret fresh or switch to
# a durable credential.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: 0xr3ngar/grok-build-review-action@v1
        with:
          grok_auth_json: ${{ secrets.GROK_AUTH_JSON }}
          pr_number: ${{ inputs.pr_number }}
          roast_level: professional
          fail_on: never
          effort: high
          max_diff_kb: "300"
          custom_instructions: |
            This is a Rust (edition 2024) crate for Grok-1 GOZ1 quantization.
            Flag: pickle accepted by quantize-goz1; preserve/fp16 misclassification
            via name mismatch; V2 structural manifests used for runtime packs before
            #40/RM-191; CUDA kernels living in this repo instead of myelin-accelerator;
            inventing xai-dissect manifest fields. Prefer project AGENTS.md / CLAUDE.md.
