name: Grok PR Review

# Manual only. Auto pull_request runs red the PR "review" check whenever
# GROK_AUTH_JSON is stale (SuperGrok OIDC ~hours), and GitHub still reports
# that check as fail even with continue-on-error / fail_on: never.
# Re-enable on: pull_request only if you keep the secret fresh or switch to
# a durable credential.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # `pr_number` is interpolated into a git ref below; reject anything that is
      # not a plain decimal so a malformed dispatch fails loudly here rather than
      # resolving to some unintended ref.
      - name: Validate pr_number
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          case "$PR_NUMBER" in
            '' | *[!0-9]*)
              echo "::error::pr_number must be digits only, got '$PR_NUMBER'"
              exit 1
              ;;
          esac

      # workflow_dispatch checks out the dispatch branch by default, which would
      # review main instead of the requested PR. Pin the PR head explicitly.
      # fetch-depth 0 so the action can diff against the base branch.
      - name: Check out the PR under review
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      - uses: 0xr3ngar/grok-build-review-action@v1
        with:
          grok_auth_json: ${{ secrets.GROK_AUTH_JSON }}
          pr_number: ${{ inputs.pr_number }}
          roast_level: professional
          fail_on: never
          effort: high
          max_diff_kb: "300"
          custom_instructions: |
            This is a Rust (edition 2024) crate for Grok-1 GOZ1 quantization.
            Flag: pickle accepted by quantize-goz1; preserve/fp16 misclassification
            via name mismatch; V2 structural manifests used for runtime packs before
            #40/RM-191; CUDA kernels living in this repo instead of myelin-accelerator;
            inventing xai-dissect manifest fields. Prefer project AGENTS.md / CLAUDE.md.
