name: Python scripts

on:
  pull_request:
  push:
    branches:
      - main
      - "releases/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export-npy-tests:
    name: export script unittests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Install NumPy (round-trip load check)
        run: python3 -m pip install --user 'numpy>=1.26,<3'

      - name: Unit tests (f32 embedding export)
        run: python3 -m unittest scripts.test_export_grok1_embedding_npy -v

      - name: Unit tests (int8 dequant export)
        run: python3 -m unittest scripts.test_export_grok1_int8_npy -v

      - name: Unit tests (manifest selection + output-path safety)
        run: python3 -m unittest scripts.test_export_grok1_int8_select -v

      - name: Unit tests (route-preservation gates)
        run: python3 -m unittest scripts.test_route_preservation_surface -v

      - name: Unit tests (GOZ1 pack readback)
        run: python3 -m unittest scripts.test_route_preservation_io -v

      # The documented under-packing guard (GH #107). Fail-closed cannot see an
      # absent tensor, so this is the check that stands between a short pack and
      # a published "certified" result.
      - name: Unit tests (pack completeness gate)
        run: python3 -m unittest scripts.test_route_preservation_completeness -v
      # Committed artifacts must stay in canonical form (GH #108) -- the guard
      # that stops three writers disagreeing on sort_keys again.
      - name: Unit tests (canonical JSON + committed artifacts)
        run: python3 -m unittest scripts.test_json_canonical -v

      - name: Unit tests (multi-block remedy decisions)
        run: python3 -m unittest scripts.test_grok1_multiblock_experiment -v

      - name: Unit tests (multi-block progress journal)
        run: python3 -m unittest scripts.test_grok1_multiblock_progress -v

      - name: Unit tests (v4 completeness and ranking)
        run: python3 -m unittest scripts.test_grok1_multiblock_v4_decision -v

      - name: Unit tests (bounded INT4 side tables)
        run: python3 -m unittest scripts.test_grok1_multiblock_side_table -v

      - name: Unit tests (content-bound INT4 side tables)
        run: python3 -m unittest scripts.test_grok1_multiblock_side_table_binding -v

      - name: Unit tests (v4 out-of-process supervisor)
        run: python3 -m unittest scripts.test_grok1_multiblock_v4_supervisor -v

      # These two were reachable only through `just review` (GH #98). They cover
      # the block-forward and block-weight kernels behind every published
      # forward-pass number, and no CI workflow ran them.
      - name: Unit tests (block forward pass)
        run: python3 -m unittest scripts.test_grok1_block_forward -v

      - name: Unit tests (block weight loading)
        run: python3 -m unittest scripts.test_grok1_block_weights -v

      - name: Codex co-author hook contract
        run: |
          jq empty .codex/hooks.json
          bash -n .codex/hooks/*.sh
          bash .codex/hooks/test-coauthor-hooks.sh
