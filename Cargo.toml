[package]
name = "grok-ozempic"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "SNN-logic quantization for Grok models — turning big model into spikes"
repository = "https://github.com/rmems/grok-ozempic"
license = "Apache-2.0 OR MIT"
keywords = ["snn", "spiking", "quantization", "moe", "grok"]
categories = ["science", "algorithms"]
readme = "README.md"

[dependencies]
# Planned CUDA backend: myelin-accelerator
# Uncomment and set `default-features = false` once the crate is published
# and the FFI bridge in src/core/backend.rs is ready.
# myelin-accelerator = { git = "https://github.com/rmems/myelin-accelerator", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
thiserror = "2.0"
safetensors = "0.8.0"          # optional HF-style shards (JAX workflows often use .npy via npy module)
memmap2 = "0.9"              # zero-copy memory-mapped file I/O for out-of-core streaming
half = "2.4"                 # FP16 (f16) type for mixed-precision router weights
tokio = { version = "1.0", features = ["full"], optional = true }  # future async loading
clap = { version = "4.6.1", features = ["derive"], optional = true }
anyhow = { version = "1.0.102", optional = true }

[features]
default = []
async = ["tokio"]
cli = ["dep:clap", "dep:anyhow"]

[[bin]]
name = "grok-ozempic"
required-features = ["cli"]

# Standalone crate when nested under a parent workspace (see parent Cargo.toml).
[workspace]
