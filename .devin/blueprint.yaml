# https://docs.devin.ai/onboard-devin/environment-yaml
# Repo-level environment for rmems/grok-ozempic (Rust + light Python for npy export).
# Commands run from the repo root.
# Rust pin: 1.97.1 for Devin. CI uses dtolnay/rust-toolchain@stable (moving channel;
# often 1.97.1 today, not a fixed pin in workflow YAML).

initialize: |
  set -e
  # Always require rustup so we can pin the toolchain (cargo-only images bypass pins).
  if ! command -v rustup >/dev/null 2>&1; then
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
  fi
  echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$ENVRC"
  export PATH="$HOME/.cargo/bin:$PATH"

  rustup toolchain install 1.97.1
  rustup default 1.97.1
  # Fail init if clippy/rustfmt missing — lint knowledge requires them.
  rustup component add --toolchain 1.97.1 rustfmt clippy

  if ! command -v cargo >/dev/null 2>&1; then
    echo "cargo missing after rustup 1.97.1 setup" >&2
    exit 1
  fi
  cargo +1.97.1 fetch --locked

maintenance: |
  set -e
  export PATH="$HOME/.cargo/bin:$PATH"
  rustup default 1.97.1
  rustup component add --toolchain 1.97.1 rustfmt clippy
  cargo +1.97.1 fetch --locked

knowledge:
  - name: lint
    contents: |
      cargo +1.97.1 fmt --all -- --check
      cargo +1.97.1 clippy --all-targets --features cli --locked -- -D warnings
  - name: test
    contents: |
      cargo +1.97.1 test --features cli --locked
  - name: build
    contents: |
      cargo +1.97.1 build --features cli --locked
  - name: format
    contents: |
      cargo +1.97.1 fmt --all
  - name: smoke
    contents: |
      cargo +1.97.1 run --features cli --locked -- quantize-goz1 --help
      cargo +1.97.1 run --features cli --locked -- validate-ingest --help
  - name: notes
    contents: |
      Official Grok-1 pickle is not accepted by quantize-goz1; export npy first (stdlib-only script).
      Runtime V2 structural-manifest is rejected until GH #40 / RM-191.
      Prefer dissect/grok-1/baseline.json for quantize-goz1 today.
      CUDA kernels belong in myelin-accelerator, not this crate.
      Claude Code cloud uses .claude/ + CLAUDE.md; this blueprint is for Devin.
